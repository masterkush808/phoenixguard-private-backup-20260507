<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overlay Demo</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f14;
        color: #e8edf2;
        font-family: Arial, sans-serif;
      }
      #overlayShell {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      #overlayStage {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        padding: 8px;
      }
      #overlayHeader {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255,255,255,0.14);
        background: rgba(12, 16, 22, 0.92);
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      #brokerFrame {
        display: block;
        background: #0b0f14;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="overlayShell">
      <div id="overlayHeader">Overlay Demo - pocket-live-8788</div>
      <div id="overlayStage">
        <img id="brokerFrame" alt="Broker window capture">
      </div>
    </div>
    <script>
      const frame = document.getElementById('brokerFrame');
      const header = document.getElementById('overlayHeader');
      const sessionId = 'pocket-live-8788';
      const apiBase = (location.protocol === 'file:') ? 'http://127.0.0.1:8793' : '';

      function frameValue(value) {
        const number = Number(value);
        return Number.isFinite(number) && number > 0 ? Math.round(number) : 0;
      }

      function operatorArtifactVersion(kind, payload = {}) {
        const surface = payload.surface && typeof payload.surface === 'object' ? payload.surface : {};
        const freshness = payload.freshness && typeof payload.freshness === 'object' ? payload.freshness : {};
        const frameKey = Math.max(
          frameValue(surface.frame_id),
          frameValue(payload.revision),
          frameValue(payload.state_version),
        );
        return [kind, frameKey, freshness.observed_at || ''].filter(Boolean).join('|') || String(Date.now());
      }

      async function latestOperatorState() {
        const encodedSessionId = encodeURIComponent(sessionId);
        const response = await fetch(`${apiBase}/v1/mobile/operator/state/v1/${encodedSessionId}?view=all`, {cache: 'no-store'});
        if (!response.ok) {
          throw new Error(`Operator state fetch failed: ${response.status}`);
        }
        return response.json();
      }

      async function refreshFrame(kind = 'full-overlay') {
        const payload = await latestOperatorState();
        const version = encodeURIComponent(operatorArtifactVersion(kind, payload));
        const encodedSessionId = encodeURIComponent(sessionId);
        frame.src = `${apiBase}/v1/mobile/window-tracker/sessions/${encodedSessionId}/artifacts/latest-${kind}?v=${version}`;
        header.textContent = `Overlay Demo - ${sessionId}`;
      }
      frame.addEventListener('error', () => {
        refreshFrame('window').catch(() => {
          frame.removeAttribute('src');
          header.textContent = 'Overlay Demo - waiting for PhoenixGuard';
        });
      });
      refreshFrame().catch(() => refreshFrame('window').catch(() => {
        header.textContent = 'Overlay Demo - waiting for PhoenixGuard';
      }));
      setInterval(() => {
        refreshFrame().catch(() => refreshFrame('window').catch(() => {
          header.textContent = 'Overlay Demo - waiting for PhoenixGuard';
        }));
      }, 1000);
    </script>
  </body>
</html>
